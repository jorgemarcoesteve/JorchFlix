version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jorchflix-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - jorchflix-data:/app/data
    networks:
      - jorchflix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jorchflix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jorchflix-net

volumes:
  jorchflix-data:

networks:
  jorchflix-net:
    driver: bridge
