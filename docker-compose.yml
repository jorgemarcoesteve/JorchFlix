services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jorchflix-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - jorchflix-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jorchflix-frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

volumes:
  jorchflix-data:
