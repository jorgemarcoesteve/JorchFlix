version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jorchflix-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=${SONARR_URL}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
    volumes:
      - jorchflix-data:/app/data
    networks:
      - jorchflix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jorchflix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jorchflix-net

volumes:
  jorchflix-data:

networks:
  jorchflix-net:
    driver: bridge
